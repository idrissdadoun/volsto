# Dupire local-vol grid / finite-difference settings (SPEC §2.3).
grid:
  t_min: 0.00273972602   # 1/365
  t_max: 3.0
  n_t: 400                # square-root spaced in t
  k_min: -1.5
  k_max: 1.5
  n_k: 1201               # dk = 0.0025; coarser grids bias short-dated local skew
  dk: 0.001
  dt: 0.001
  floor: 0.0001          # variance floor: 1% vol
  cap: 25.0              # variance cap: 500% vol
