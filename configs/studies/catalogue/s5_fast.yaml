# S5 CI-fast variant: the toy marking grid of the sanctioned test fixture
# (tests/conftest.py::toy_marking_build — the placeholder surface flagged marking,
# ssr_target {1.0, 1.5} x skew_eps {0.05, 0.10}, 2e4 particles, 1y horizon, M4 products, no
# risk).  The tests pass --grid / --store / --cache / --outputs; the grid path below is the name
# the fixture is expected to use.  Fast mode is plumbing, not numbers: the placeholder SSVI is
# unsuitable for marking work, and the 1y -> 2y forward window lies beyond the 1y horizon.
name: s5_marking_fast
runner: volsto.studies.catalogue.s5_marking
grid: configs/grids/toy_marking.yaml
store: outputs/store
cache: cache
outputs: outputs
mode: fast
seeds: {}
params:
  surfaces: [placeholder]
  binding_map:                   # two inline fits (~6 s each on the placeholder)
    ssr_target: [1.0, 1.5]
    skew_eps: [0.10]
  reference_mark: {ssr_target: 1.0, skew_eps: 0.10}
  products: [cliquet_1y, atm_vol, vs_vol, volswap_vol]
  ssr_pillars: [0.25, 1.0]
  forward_windows: [[1.0, 2.0]]
  greeks: {products: [], names: []}
  recorded_m7_fits: true
