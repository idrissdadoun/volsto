# S3 CI-fast variant (runner volsto/studies/catalogue/s3_conditional_variance.py): the toy build
# of tests/conftest.py::toy_build (LV + 1F nu 0.25 / 0.5 at rho -0.7 + 2F Table 8.2; 2e4
# particles, 1y horizon), 4000 paths.  The tests pass --grid/--store/--cache/--outputs.  The
# toy store has no conditional products (the store check compares nothing); the rho sweep has
# one point.  Plumbing, not numbers.
name: s3_conditional_variance_fast
runner: volsto.studies.catalogue.s3_conditional_variance
grid: configs/grids/toy.yaml
store: outputs/store
cache: cache
outputs: outputs
mode: fast
seeds: {pricing: 2024}
params:
  models:
    surface: placeholder
    lv: true
    one_factor: {nu: all, rho: all, kappa: all}
    two_factor: all
  maturity: 1.0
  per_year: 252
  conditional_barriers: [0.9, 1.0, 1.1]
  ko_barriers: [1.05, 1.10, 1.20]
  n_paths: 4000
  sweeps:
    nu: {rho: -0.7, kappa: 1.5}
    rho: {nu: 0.5, kappa: 1.5}
  store_check: true
  monitoring_order:
    barrier: 0.9
    per_year: [63, 126, 252]
    n_paths: 4000
    model: {nu: 0.5, rho: -0.7, kappa: 1.5}
