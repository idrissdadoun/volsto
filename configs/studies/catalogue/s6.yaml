# S6 — shadow rotation: the M7 greek (outputs/m7) and study C's static greeks and simulated
# recalibration P&L (outputs/m8b) side by side, per policy, in the declared desk convention
# (SPEC §10.2).  Artefacts only: no grid, no leverage, no store point is read.
name: s6_shadow_rotation
runner: volsto.studies.catalogue.s6_shadow_rotation
grid: null
store: outputs/store
cache: cache
outputs: outputs
mode: full
seeds: {}                      # nothing is simulated (the M7 / M8b runs used seed 2024)
params:
  # study C's configured set (volsto.studies.m8b.BOOK x ROTAS x RECALIBRATIONS_C): the table is
  # checked against it and the missing rows are listed
  products: [autocall 3y, phoenix 3y, cliquet 1y, vko put 12m, ko var 1y]
  rotas: [1.0, 2.0, 3.0]
  recalibrations: [none, sabr_linked, sticky_breakeven]
  first_order_tolerance: 0.30  # M8b's FIRST_ORDER_TOLERANCE (|ratio - 1| <= 0.30)
  m7_surface: spx              # the `surface` rows of m7/p1_marking_shadow_rotation.csv shown
  m7_product: autocall 3y      # what the M7 greek priced (the M6 headline 3y autocall)
