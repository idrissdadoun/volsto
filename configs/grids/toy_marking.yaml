# Toy marking grid of the test suite — calibrated exactly once per pytest run, in the
# tests/conftest.py session fixture toy_marking_build (a sanctioned calibrating site beside
# toy_build; consumed by the S5 marking study's fast test): the P1 marking fits
# (volsto.calibration.fit_2f.fit_2f_marking, k2 0.2, nu cap 3.5, two-point skew constraint) on
# the placeholder reference surface at ssr_target {1.0, 1.5} x skew_eps {0.05, 0.10} (4 points,
# at most 4 calibrations at 2e4 particles over a 1y horizon — an infeasible fit is stored without
# one), plus the surface's LV point; tiny pricing budget, no risk, M4 products only.
# Loaded as volsto.viewers.grid.GridSpec.
name: toy_marking
reference_spec: configs/studies/lsv_reference_2f.yaml
surfaces:
  - {name: placeholder, kind: placeholder, one_factor: false, two_factor: false, marking: true}
particle:
  n_particles: 20000
  horizon: 1.0
marking:
  ssr_target: [1.0, 1.5]
  skew_eps: [0.05, 0.10]
include_degenerate: false
products:
  m4: true
  m6: false
  conditional: false
  cliquet_maturities: [1.0]
pricing:
  n_paths: 4000
  seed: 2024
risk:
  tier: none
  products: ["autocall 3y", "cliquet 1y"]
  light_pillars: [0.25, 1.0, 3.0]
  fwd_var_buckets: 20
