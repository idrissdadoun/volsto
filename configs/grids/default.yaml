# Default viewer precompute grid (SPEC §9.2, M9 Part 1).  Loaded as volsto.viewers.grid.GridSpec.
#
# Surfaces: the placeholder reference SSVI (market and surface of the reference study spec) and
# the three SPX snapshots of M7.  Flags per surface (no defaults): the 1F axes and the 2F preset
# run on the placeholder only (the old M4 / M6 studies); the marking presets run on every
# snapshot (a snapshot opts into the 1F axes with `one_factor: true`).  Every surface gets its
# pure-LV point (the ω = 0 row / the model-risk reference) whatever the flags.
#
# Counts: placeholder 7 × 5 × 3 = 105 one-factor combinations = 90 LSV calibrations + 15 ω = 0
# combinations that are the single LV point + 1 Table 8.2 point; 4 × 3 = 12 marking fits per
# snapshot (36); 4 LV points.  The degenerate ω ∈ {1, 2, 3} (ν 0.5 / 1 / 1.5, ρ −0.7, κ 1.5) points
# lie on the axes (include_degenerate keeps them if the axes change).
name: default
reference_spec: configs/studies/lsv_reference_2f.yaml   # particle / sim / local-vol settings
surfaces:
  - {name: placeholder, kind: placeholder, one_factor: true, two_factor: true, marking: false}
  - name: spx_2022-12-30
    kind: snapshot
    path: configs/surfaces/snapshots/hdn_2022H2_ssvi/spx_2022-12-30.yaml
    one_factor: false
    two_factor: false
    marking: true
  - name: spx_2022-09-15
    kind: snapshot
    path: configs/surfaces/snapshots/spx_2022-09-15.yaml
    one_factor: false
    two_factor: false
    marking: true
  - name: spx_2022-12-02
    kind: snapshot
    path: configs/surfaces/snapshots/spx_2022-12-02.yaml
    one_factor: false
    two_factor: false
    marking: true
particle:
  n_particles: 800000      # SPEC §11 production count (single seed, from the reference spec)
  horizon: 3.0
one_factor:                # ν = ω / 2; ν = 0 is the LV point
  nu: [0.0, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5]
  rho: [-0.9, -0.7, -0.5, -0.3, 0.0]
  kappa: [0.5, 1.5, 4.0]
two_factor_presets:
  - name: "Table 8.2"      # Bergomi Table 8.2 (configs/studies/lsv_reference_2f.yaml)
    model: {nu: 1.74, theta: 0.245, k1: 5.35, k2: 0.28, rho12: 0.0, rho_SX1: -0.759, rho_SX2: -0.487}
marking:                   # fit_2f_marking on each snapshot surface (k2 0.2, ν cap 3.5)
  ssr_target: [0.75, 1.0, 1.25, 1.5]
  skew_eps: [0.05, 0.10, 0.20]
include_degenerate: true
products:
  m4: true                 # run_headline: forward smile, fwd VS / vol swap, cliquets
  m6: true                 # run_m6_headline: 3y autocall and Phoenix
  conditional: true        # M4c conditional-variance and VKO columns
  cliquet_maturities: [1.0, 2.0]
pricing:
  n_paths: 400000          # the M4 / M6 baseline convention (tests/test_m4_regression.py)
  seed: 2024
risk:
  tier: light              # none | light | full (volsto-precompute --risk overrides)
  products: ["autocall 3y", "cliquet 1y"]
  light_pillars: [0.25, 1.0, 3.0]
  fwd_var_buckets: 3      # OWNER DECISION 2026-09-16: 3 for the grid, 20 stays the library
                          # default.  The grid exists for cross-model comparison, where a
                          # short / belly / long ladder — (0,0.25), (0.25,1), (1,3), i.e.
                          # len(light_pillars) — is ample; the 20-bucket M5 ladder (monthly to 1y,
                          # quarterly to 3y) is a per-product RiskReport, generated on demand for
                          # one point with the risk-only refresh at the full tier, which runs
                          # every section at the library defaults (the 20-bucket ladder included):
                          #   volsto-precompute --grid <this> --only <id> --resume --risk full
                          # (--resume compares tiers, not bucket counts, so re-running light with
                          # 20 here would skip a point stored at light) — or directly from
                          # volsto.risk.report.risk_report, whose default is the 20-bucket
                          # ladder.  Every bucket is one leverage
                          # recalibration: 17 instead of 34 per LSV point, 121.7 h instead of
                          # 224.3 h single-process on this grid (volsto-precompute --dry-run).
